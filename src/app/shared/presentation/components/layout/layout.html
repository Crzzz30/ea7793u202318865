<mat-sidenav-container class="sidenav-container">

  <mat-sidenav
    #drawer
    mode="side"
    opened
    aria-label="Main Navigation">

    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active-link"><mat-icon matListItemIcon>home</mat-icon> <span matListItemTitle>Home</span> </a>
      <a mat-list-item routerLink="/home" routerLinkActive="active-link"><mat-icon matListItemIcon>add_circle</mat-icon> <span matListItemTitle>New Reservation</span> </a>
    </mat-nav-list>
  </mat-sidenav>


  <mat-sidenav-content>
    <mat-toolbar >
      <button mat-icon-button type="button" aria-label="Toggle navigation menu" (click)="drawer.toggle()"><mat-icon>menu</mat-icon></button><span class ="app-title">Adventure Camp</span>
      <span class="spacer"></span>
      <button mat-button>EN</button>
      <button mat-button>ES</button>
    </mat-toolbar>

    <main> class="page-content"<router-outlet /></main>
  </mat-sidenav-content>

</mat-sidenav-container>
